name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build first: it generates next-env.d.ts + .next/types (PageProps/
      # LayoutProps, image module declarations) that tsc --noEmit needs,
      # and next build already runs its own full type check internally —
      # so this also fails fast on a real type error before the redundant
      # standalone check below.
      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit
