name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add root index.html, locale dirs, and EN fallback pages
        run: |
          cp out/en.html out/index.html
          for locale in en ru th he; do
            if [ -f "out/${locale}.html" ] && [ ! -f "out/${locale}/index.html" ]; then
              mkdir -p "out/${locale}"
              cp "out/${locale}.html" "out/${locale}/index.html"
            fi
          done
          # Recursively copy ALL EN files to root (covers sub-pages too)
          cd out/en
          find . -type f -name '*.html' | while read f; do
            dir="$(dirname "$f")"
            mkdir -p "../$dir"
            cp "$f" "../$f"
            echo "Copied: $f"
          done
          echo "Added locale index.html files and EN fallback pages"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
