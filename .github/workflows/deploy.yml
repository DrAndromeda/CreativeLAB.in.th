name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add root index.html and locale directories
        run: |
          cp out/en.html out/index.html
          for locale in en ru th he; do
            if [ -f "out/${locale}.html" ] && [ ! -f "out/${locale}/index.html" ]; then
              mkdir -p "out/${locale}"
              cp "out/${locale}.html" "out/${locale}/index.html"
            fi
            # Fix menu links — add locale prefix to internal page links
            if [ -f "out/${locale}.html" ]; then
              sed -i -E "s|href=\"/CreativeLAB\.in\.th/([a-z][a-z0-9_-]+)\"|href=\"/CreativeLAB.in.th/${locale}/\1\"|g" "out/${locale}.html"
              echo "Fixed locale links in ${locale}.html"
            fi
            # Also fix locale/index.html if it exists
            if [ -f "out/${locale}/index.html" ]; then
              sed -i -E "s|href=\"/CreativeLAB\.in\.th/([a-z][a-z0-9_-]+)\"|href=\"/CreativeLAB.in.th/${locale}/\1\"|g" "out/${locale}/index.html"
            fi
          done
          echo "Added locale index.html files and fixed links"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
